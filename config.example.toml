# Sample agent config. Copy it to ~/.voca/config.toml (another path: VOCA_CONFIG).
# A one-off override for one run: VOCA_<SECTION>__<FIELD>, e.g.
# VOCA_COMPRESSION__THRESHOLD=0.08 scripts/up.sh agent.
# Fields that later tasks of the epic will read are already validated at start.

[model]
# Context window in tokens; equal to -c in scripts/llama.sh, a mismatch writes context_mismatch.
context_tokens = 16384
# Reasoning budget sent as thinking_budget_tokens with each LLM request.
thinking_budget = 128
# Sampling: unset values are not sent, sampling then comes from the server profile.
# temperature = …
# top_k = …
# top_p = …
# repeat_penalty = …

[agent]
# Supertonic voice of the agent.
tts_voice = "F4"
# Silence in seconds that ends speech for Silero VAD.
vad_min_silence = 0.3
# Seconds of user speech that interrupt the agent; G5 tunes it.
interruption_min_duration = 0.5
# Words of user speech that interrupt the agent; G5 tunes it.
interruption_min_words = 0
# Seconds from the start of the session's first agent reply during which interruptions are ignored (once per session); G5 tunes it.
aec_warmup = 3.0
# Seconds of silence before the user's turn ends; G6 tunes it, measured in VOCA-46.
endpointing_min_delay = 0.2
# Start the reply before the user's turn ends; measured in VOCA-46.
preemptive_generation = true
# Seconds between the end of an unanswered fragment and the next reply within which they are glued into one turn.
glue_window_s = 3.0
# Seconds of user silence `delegate` waits before sending a task to Hermes.
action_silence_s = 0.5
# Seconds of silence (neither the user nor the agent speaks) before the agent tells about waiting Hermes results and failures; at the end of the agent's own answer it tells at once.
event_silence_s = 1.5

[session]
# SQLite file of the session history.
path = "~/.voca/sessions.sqlite3"
# Messages sent to a client in voca.history when it joins.
history_on_join = 50

[compression]
# Share of context_tokens that triggers compression; 0 turns the trigger off.
threshold = 0.60
# Share of the window for the emergency trim when there is no summary.
hard_limit = 0.85
# Share of the window the trim goes down to (the former ctx_trim_low).
trim_to = 0.40
# Tail budget = tail_ratio × threshold × context_tokens.
# The idle and daily triggers skip a context not above this budget.
tail_ratio = 0.20
# Turns kept in the tail at least.
tail_turns_min = 2
# Hours since the last message after which the session is compressed; 0 turns it off.
# Checked when a page joins and at every reply, no timer; the summary is adopted one reply later.
idle_hours = 4
# Daily compression boundary HH:MM in the host's local time; "" turns it off.
# Checked when a page joins and at every reply: if the boundary passed since the last compression.
daily_at = "04:00"

[compression.model]
# The key is not written here: VOCA_LITELLM_KEY in .env only.
# LiteLLM on the rpi, the route works only in the tailnet.
url = "https://litellm.priney.com/v1"
# Model name in LiteLLM.
model = "glm-5.3-flash"
# Request timeout in seconds.
timeout_s = 60

[memory]
# Facts about the user, appended to the instructions after the header «[ПАМЯТЬ — ТОЛЬКО СПРАВКА]».
# A missing or empty file means no memory. Read whole, no length limit.
# Read at job start, after an adopted summary and when the instructions change.
path = "~/.voca/memory.md"

[delegation]
# Hermes URL and key are not written here: VOCA_HERMES_URL and VOCA_HERMES_KEY in .env only.
# Tasks given to Hermes (voca bench delegate, later the agent's delegate tool).
path = "~/.voca/tasks.sqlite3"
# Seconds from the task's creation after which VOCA sends /stop to the run.
run_timeout = 900
# Hermes `approvals.timeout` of the `voca` profile: a request expires this many seconds after it arrived.
approval_timeout_s = 300
# The agent reminds once this many seconds before the expiry, in silence; 0 turns the reminder off.
approval_reminder_s = 60

[decision]
# The decision model sorts every user reply into noise or a reply (VOCA-46) and, while Hermes approval
# requests wait, answers the questions of the approval judge (VOCA-48):
# LiquidAI d1-2B on scripts/decision.sh, GPU by default, VOCA_DECISION_NGL=0 in .env runs it on the CPU.
# The model file is VOCA_DECISION_MODEL in .env (scripts do not read this file).
# false: no sorter; nothing is approved or denied by voice, the buttons answer.
enabled = true
# POST <url>/v1/systemone; scripts/env.sh exports VOCA_DECISION__URL, which overrides this.
url = "http://127.0.0.1:8086"
model = "d1-2B"
# HTTP timeout of the decision client.
timeout_s = 1.5
# The sorter question: is the user's reply noise or a reply; the criteria are [decision.sorter_criteria].
sorter_instructions = "Ассистент разговаривает с пользователем голосом. В состоянии — последняя фраза ассистента, ожидающие запросы подтверждения команд и фраза пользователя в виде распознанной речи. Что это за фраза пользователя?"
# Seconds to wait for the sorter; on failure while the agent speaks the length threshold decides.
sorter_timeout_s = 0.3
# Single words; a reply with one of these words is never dropped as noise; stop commands are keep words so they interrupt the agent's speech.
sorter_keep_words = ["нет", "не", "ни", "стоп", "да", "давай", "хватит", "стой", "подожди", "подождите", "погоди", "замолчи", "замолчите", "достаточно", "тихо"]
# Only a reply of at most this many words is dropped as noise.
sorter_max_words = 4
# When the sorter fails while the agent speaks, a reply with fewer words and no keep word is dropped.
sorter_min_words = 2
# The question asked while requests wait: does the reply answer a request, ask about it, or neither;
# the criteria are [decision.sorter_relation_criteria].
sorter_relation_instructions = "Ассистент ждёт ответа на запрос подтверждения команды. Как фраза пользователя связана с этим запросом?"
# The question asked while requests wait: approve or deny; the criteria are [decision.sorter_answer_criteria].
sorter_answer_instructions = "Ассистент ждёт ответа на запрос подтверждения команды. Что пользователь отвечает этой фразой на запрос?"
# The question asked while two or more requests wait: which request the reply is about.
sorter_target_instructions = "Ассистент ждёт ответа на несколько запросов подтверждения команд, они пронумерованы: запрос 1, запрос 2 и далее. К какому запросу относится фраза пользователя?"
# The criterion of request n of the target question; must contain {n}.
sorter_target_request = "только к запросу {n}"
# The criterion «no single request» of the target question.
sorter_target_unclear = "к нескольким запросам, ни к одному или непонятно"
# The judge's confidence (kind × relation × answer, × target with two or more requests) needed to approve
# a request of this danger level.
threshold_low = 0.45
threshold_medium = 0.5
threshold_high = 0.5
# The judge's confidence needed to deny a request.
threshold_deny = 0.45
# Clarifications in a row; then the agent says the request stays in the queue.
clarify_limit = 2

[decision.sorter_criteria]
# Exactly these two; noise is dropped, reply makes a turn.
noise = "шум, обрывок, поддакивание или междометие без смысла: «угу», «ага», «yeah», «okay», «ну»"
reply = "осмысленная реплика: ответ, вопрос, просьба или мысль"

[decision.sorter_relation_criteria]
# Exactly these three.
answers = "отвечает на запрос: разрешает или запрещает выполнить команду"
asks = "спрашивает о запросе: что именно будет сделано, зачем, просит повторить"
other = "не о запросе: другая тема, просьба или разговор"

[decision.sorter_answer_criteria]
# Exactly these two.
approve = "подтверждает: разрешает выполнить команду"
deny = "отклоняет: запрещает выполнять команду"
