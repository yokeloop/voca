name: checks

on:
  pull_request:
  push:
    branches: [main, "flow/**"]

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: 0.12.23
      - run: (cd agent && uv sync --locked --group dev)
      - run: (cd agent && uv run --offline --no-sync ruff format --check src tests ../bench)
      - run: (cd agent && uv run --offline --no-sync ruff check src tests ../bench)
      - run: (cd agent && uv run --offline --no-sync mypy)
      - run: (cd agent && uv run --offline --no-sync pytest -q)
      - run: bash -n scripts/*.sh
      - run: git diff --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web format:check
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web build
