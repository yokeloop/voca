name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: 0.12.4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.15
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: (cd backend && uv sync --locked --group dev)
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: (cd backend && uv run --offline --no-sync ruff format --check src tests)
      - run: (cd backend && uv run --offline --no-sync ruff check src tests)
      - run: (cd backend && uv run --offline --no-sync mypy src/voca)
      - run: (cd backend && uv run --offline --no-sync pytest -q)
      - run: pnpm --dir frontend format:check
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: git diff --check
