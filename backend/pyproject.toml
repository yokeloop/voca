[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voca"
version = "0.1.0"
description = "Local VOCA session foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "starlette>=0.40,<1",
  "uvicorn>=0.32,<1",
  "websockets>=13,<16",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/voca"]
